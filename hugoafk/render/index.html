<!doctype html>
<html><head><meta charset="utf-8"><title>HugoAFK Promo Renderer</title>
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter.ttf') format('truetype');font-weight:100 900;}
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk.ttf') format('truetype');font-weight:300 700;}
@font-face{font-family:'Orbitron';src:url('fonts/Orbitron.ttf') format('truetype');font-weight:400 900;}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono.ttf') format('truetype');font-weight:100 800;}
@font-face{font-family:'Syne';src:url('fonts/Syne.ttf') format('truetype');font-weight:400 800;}
@font-face{font-family:'Unbounded';src:url('fonts/Unbounded.ttf') format('truetype');font-weight:200 900;}
@font-face{font-family:'Press Start 2P';src:url('fonts/PressStart2P-Regular.ttf') format('truetype');font-weight:400;}
@font-face{font-family:'VT323';src:url('fonts/VT323-Regular.ttf') format('truetype');font-weight:400;}
@font-face{font-family:'Silkscreen';src:url('fonts/Silkscreen-Bold.ttf') format('truetype');font-weight:700;}
html,body{margin:0;background:#000;}
canvas{display:block;}
</style></head>
<body>
<canvas id="main" width="1080" height="1920"></canvas>
<script src="assets/logo_meta.js"></script>
<script src="engine.js"></script>
<script src="tokens.js"></script>
<script src="scenes/index.js"></script>
<script src="scenes/s01_s02.js"></script>
<script src="scenes/s03_s04.js"></script>
<script src="scenes/s05.js"></script>
<script src="scenes/s06_s07.js"></script>
<script src="scenes/s08.js"></script>
<script src="scenes/s09_s10.js"></script>
<script src="timeline.js"></script>
<script>
// IMG.<name> holds decoded images, ready before the first frame is rendered.
const IMG = {};
window.__ready = (async () => {
  const fams = ['Inter','Space Grotesk','Orbitron','JetBrains Mono','Syne','Unbounded','Press Start 2P','VT323','Silkscreen'];
  const loads = [];
  for (const f of fams) for (const w of [300,400,500,600,700,800,900]) loads.push(document.fonts.load(`${w} 100px "${f}"`).catch(()=>null));
  await Promise.all(loads);
  await document.fonts.ready;
  const assets = { logo: 'assets/logo.png', logoHugo: 'assets/logo_hugo.png', logoAfk: 'assets/logo_afk.png' };
  await Promise.all(Object.entries(assets).map(([k, src]) => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => rej(new Error('asset failed: ' + src)); im.src = src;
  })));
  IMG.meta = window.LOGO_META;
  Engine.init(document.getElementById('main'));
  return fams.map(f => f + ':' + document.fonts.check(`700 100px "${f}"`)).join(',') + ' | assets:' + Object.keys(IMG).join('/');
})();
</script>
</body></html>
